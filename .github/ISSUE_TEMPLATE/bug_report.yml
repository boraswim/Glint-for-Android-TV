name: Bug report
description: Something in Glint doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't attach films or other copyrighted files.
        Security problems go through the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, step by step, and what went wrong.
      placeholder: "1. Opened a film from Home\n2. Pressed Play\n3. The picture stayed black"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - "Playback: picture"
        - "Playback: sound or subtitles"
        - "Library: matching, artwork or ratings"
        - "Shares: adding or connecting"
        - "Home, browsing or search"
        - "Settings or profiles"
        - "Something else"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Glint version
      description: Settings → About.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: TV or box, and Android version
      placeholder: "Philips 2021 UHD Android TV, Android 11"
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: File details (for playback problems)
      description: The video and audio format from the playback menu's Info tab, and the kind of share (SMB, USB...).
